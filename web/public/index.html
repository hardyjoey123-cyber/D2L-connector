<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>JARVIS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2338e8ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2338e8ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Slow-moving grid and drifting motes. Purely decorative. -->
    <canvas id="ambient" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="frame" aria-hidden="true">
      <span class="frame__corner frame__corner--tl"></span>
      <span class="frame__corner frame__corner--tr"></span>
      <span class="frame__corner frame__corner--bl"></span>
      <span class="frame__corner frame__corner--br"></span>
    </div>

    <header class="hud">
      <div class="hud__brand">
        <span class="hud__mark"></span>
        <span class="hud__name">J.A.R.V.I.S</span>
      </div>
      <div class="hud__readout">
        <span class="hud__meta" id="model-readout">◦ linking</span>
      </div>
    </header>

    <main class="stage">
      <button
        class="core"
        id="core"
        type="button"
        aria-describedby="status"
        aria-label="Activate voice interface"
      >
        <canvas id="reactor"></canvas>
      </button>

      <p class="status" id="status" role="status" aria-live="polite">Standby</p>
      <p class="hint" id="hint">Tap the core<span class="hint__key"> or press <kbd>Space</kbd></span> to speak</p>
    </main>

    <!-- Transcription is deliberately quiet: the last exchange only, low
         contrast, behind the visualizer's glow. The full log lives in a
         panel you have to open. -->
    <section class="subtitles" id="subtitles" aria-hidden="true">
      <p class="subtitle subtitle--user" id="subtitle-user"></p>
      <p class="subtitle subtitle--reply" id="subtitle-reply"></p>
    </section>

    <form class="typed" id="typed-form" hidden>
      <span class="typed__caret">&gt;</span>
      <input
        class="typed__input"
        id="typed-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="Type instead…"
        aria-label="Type a message"
      />
    </form>

    <footer class="controls">
      <button class="ctl" id="ctl-session" type="button" aria-pressed="false">
        <span class="ctl__dot"></span><span id="ctl-session-label">Engage</span>
      </button>
      <button class="ctl" id="ctl-mute" type="button" aria-pressed="false">Voice on</button>
      <button class="ctl" id="ctl-log" type="button" aria-expanded="false" aria-controls="log">Log</button>
      <button class="ctl" id="ctl-type" type="button" aria-expanded="false" aria-controls="typed-form">Type</button>
    </footer>

    <aside class="log" id="log" hidden aria-label="Conversation transcript">
      <div class="log__head">
        <span>Transcript</span>
        <button class="log__close" id="log-close" type="button" aria-label="Close transcript">×</button>
      </div>
      <div class="log__body" id="log-body"></div>
    </aside>

    <div class="toast" id="toast" role="alert" hidden></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
